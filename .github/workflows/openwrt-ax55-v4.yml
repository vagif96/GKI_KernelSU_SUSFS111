# Builds OpenWrt (snapshot) for the TP-Link Archer AX55 v4 with the patch
# in openwrt-ax55-v4/patches. Unrelated to the GKI kernel workflows.

name: OpenWrt Archer AX55 v4

on:
  push:
    paths:
      - 'openwrt-ax55-v4/**'
      - '.github/workflows/openwrt-ax55-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # OpenWrt main the patch was written against
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_COMMIT: 8736aff81050ad27e31122d4df19354cf3cb5698

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget

      - uses: actions/checkout@v4
        with:
          path: port

      - name: Check out OpenWrt
        run: |
          git init openwrt
          cd openwrt
          git remote add origin "$OPENWRT_REPO"
          git fetch --depth 1 origin "$OPENWRT_COMMIT"
          git checkout FETCH_HEAD

      - name: Apply the AX55 v4 patch
        working-directory: openwrt
        run: |
          git apply --index ../port/openwrt-ax55-v4/patches/*.patch
          git status --short

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cp -r ../port/openwrt-ax55-v4/files files
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_tplink_archer-ax55-v4=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E "archer-ax55|INITRAMFS=|ipq-wifi" .config

      - name: Download sources
        working-directory: openwrt
        run: make -j8 download || make -j1 download V=s

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(($(nproc) + 1)) || make -j1 V=s

      - name: Collect images
        run: |
          mkdir -p out
          cp openwrt/bin/targets/qualcommax/ipq50xx/*archer-ax55-v4* out/
          cp openwrt/bin/targets/qualcommax/ipq50xx/sha256sums out/ || true
          cp openwrt/.config out/config.buildinfo
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-archer-ax55-v4
          path: out/

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="openwrt-ax55-v4-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "OpenWrt snapshot for Archer AX55 v4 (test build ${GITHUB_RUN_NUMBER})" \
            --notes "Untested on hardware. Boot the initramfs image from RAM first - see openwrt-ax55-v4/README.md. OpenWrt ${OPENWRT_COMMIT}."
